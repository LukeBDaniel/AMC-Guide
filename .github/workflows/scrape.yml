name: Daily AMC Scraper

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Fetch showtimes from AMC API
        id: scrape
        run: npm run fetch
        env:
          AMC_VENDOR_KEY: ${{ secrets.AMC_VENDOR_KEY }}

      - name: Commit and Push changes
        if: ${{ always() && (steps.scrape.outcome == 'success' || steps.scrape.outcome == 'failure') }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Stage published data
          git add data.json frontend/public/data.json
          
          # Only commit if there are actual changes to the data
          git diff --staged --quiet || (git commit -m "Automated update: AMC showtimes data" && git push)
