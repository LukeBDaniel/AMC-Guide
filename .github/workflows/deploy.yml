name: Deploy AMC Guide

on:
  push:
    branches:
      - main
  schedule:
    # 4:00 AM EDT / 3:00 AM EST
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments overlap, but don't cancel one mid-deploy either.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run tests
        run: npm test

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      # A partial fetch still publishes (failed theatres keep their previous
      # showtimes, downloaded from the live site as needed); the run is marked
      # failed at the end so it gets noticed when too many theatres fail.
      - name: Fetch showtimes from AMC API
        id: fetch
        continue-on-error: true
        run: npm run fetch
        env:
          AMC_VENDOR_KEY: ${{ secrets.AMC_VENDOR_KEY }}
          PREVIOUS_DATA_URL: ${{ steps.pages.outputs.base_url }}/data/

      # When the fetch fails outright, publish the live copy rather than nothing.
      - name: Fall back to the deployed showtimes
        if: ${{ steps.fetch.outcome == 'failure' && hashFiles('frontend/public/data/theaters.json') == '' }}
        run: |
          base="${{ steps.pages.outputs.base_url }}/data"
          mkdir -p frontend/public/data/theaters
          curl --fail --silent --show-error --location --retry 2 \
            --output frontend/public/data/theaters.json "$base/theaters.json"
          node -e 'for (const t of require("./frontend/public/data/theaters.json").theaters) console.log(t.id)' |
            while read -r id; do
              curl --fail --silent --location --retry 2 \
                --output "frontend/public/data/theaters/$id.json" "$base/theaters/$id.json" ||
                echo "::warning::No deployed showtimes for $id"
            done

      - name: Check showtimes data exists
        run: test -s frontend/public/data/theaters.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Fail run if the showtimes fetch failed
        if: ${{ steps.fetch.outcome == 'failure' }}
        run: |
          echo "::error::Showtimes fetch failed; see the 'Fetch showtimes from AMC API' step. Previous data was kept where needed."
          exit 1
